# Minimal local-dev config for the Supabase CLI. Run `supabase start` to boot a
# local Postgres + Auth stack, then `pnpm db:reset` to apply migrations.
project_id = "datumpro"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Email OTP / magic link is the default sign-in for v1. SMS OTP (Africa's Talking)
# is wired at the app layer.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
# Onboarding Phase 1: require email confirmation for password signups before a
# session is issued. OAuth and magic-link are already verified, so this mainly
# affects password-based org creators (not invited site contractors, who arrive
# via magic link / OAuth). Takes effect locally on `db reset` and on the hosted
# project via `supabase config push`.
enable_confirmations = true

# The magic-link template is what `signInWithOtp` emails — used ONLY by the
# mobile app's 6-digit OTP sign-in (the web app is password/OAuth only). It is
# code-only on purpose: any {{ .ConfirmationURL }} link gets prefetched by mail
# scanners (Yahoo/Outlook), consuming the one-time token so the code the human
# types reads as expired. Apply to hosted with `supabase config push`.
[auth.email.template.magic_link]
subject = "Your DatumPro sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Password reset is the in-page 6-digit flow (verifyOtp type:'recovery') —
# same rule: code only, no link, or scanner prefetch kills the code.
[auth.email.template.recovery]
subject = "Your DatumPro password reset code"
content_path = "./supabase/templates/recovery.html"

# chat-push is invoked by a Database Webhook, not an end-user JWT. It authorizes
# itself with the CHAT_PUSH_SECRET shared-secret header, so skip JWT verification.
[functions.chat-push]
verify_jwt = false
