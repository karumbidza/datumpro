# Minimal local-dev config for the Supabase CLI. Run `supabase start` to boot a
# local Postgres + Auth stack, then `pnpm db:reset` to apply migrations.
project_id = "datumpro"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Production values — this file is the source of truth for `supabase config push`,
# so these must be the live URLs (not localhost) or a push repoints hosted auth
# redirects at a dev machine and breaks OAuth / email links. Local `supabase
# start` also reads these; harmless for the code-only OTP flow we use (no
# redirect is followed), and local email is caught by the bundled mail server.
site_url = "https://datumpro.app"
additional_redirect_urls = [
  "https://datumpro.app/auth/callback",
  "https://datumpro.app/**",
  "https://www.datumpro.app/**",
]
# Email OTP / magic link is the default sign-in for v1. SMS OTP (Africa's Talking)
# is wired at the app layer.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
# Onboarding Phase 1: require email confirmation for password signups before a
# session is issued. OAuth and magic-link are already verified, so this mainly
# affects password-based org creators (not invited site contractors, who arrive
# via magic link / OAuth). Takes effect locally on `db reset` and on the hosted
# project via `supabase config push`.
enable_confirmations = true

# Email OTP is exactly 6 digits, expiring in 1 hour. Pinned here because the
# length is otherwise a hosted dashboard setting that silently drifts — both
# email templates, the mobile sign-in input (maxLength 6) and the web password
# reset input (maxLength 6) hard-assume 6, so an 8-digit code from the server
# is physically un-enterable. `supabase config push` applies this to hosted.
otp_length = 6
otp_expiry = 3600
# Throttle OTP/confirmation email sends (restored to the live 1-minute value the
# hosted project used; the CLI default of 1s would let the endpoint be hammered).
max_frequency = "60s"

# The magic-link template is what `signInWithOtp` emails — used ONLY by the
# mobile app's 6-digit OTP sign-in (the web app is password/OAuth only). It is
# code-only on purpose: any {{ .ConfirmationURL }} link gets prefetched by mail
# scanners (Yahoo/Outlook), consuming the one-time token so the code the human
# types reads as expired. Apply to hosted with `supabase config push`.
[auth.email.template.magic_link]
subject = "Your DatumPro sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Password reset is the in-page 6-digit flow (verifyOtp type:'recovery') —
# same rule: code only, no link, or scanner prefetch kills the code.
[auth.email.template.recovery]
subject = "Your DatumPro password reset code"
content_path = "./supabase/templates/recovery.html"

# chat-push is invoked by a Database Webhook, not an end-user JWT. It authorizes
# itself with the CHAT_PUSH_SECRET shared-secret header, so skip JWT verification.
[functions.chat-push]
verify_jwt = false

# notification-push is invoked by the notification_push_notify pg_net trigger,
# which authorizes with the NOTIFICATION_PUSH_SECRET shared-secret header instead
# of a JWT (same pattern as chat-push). Without this the gateway 401s the
# trigger's calls before they reach the function.
[functions.notification-push]
verify_jwt = false
