name: Deploy Supabase

# Manual, opt-in deploys of the Supabase Edge Functions (and, optionally, the
# migrations) to the live project. Never fires on push — you run it from the
# Actions tab (or `gh workflow run`) so a merge can't surprise-deploy prod.
#
# One-time repo setup (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal access token (Supabase dashboard → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    the project ref (dashboard URL: app.supabase.com/project/<ref>)
#   SUPABASE_DB_URL         (only for "push_migrations") the direct connection string (DIRECT_URL)
#   # only if you tick "set_function_secrets":
#   NOTIFICATION_PUSH_SECRET, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, APP_URL
#
# After the first deploy of notification-push, wire the DB trigger to it ONCE in
# the SQL editor (see supabase/functions/notification-push/README.md):
#   alter database postgres set app.notification_push_url    = 'https://<ref>.supabase.co/functions/v1/notification-push';
#   alter database postgres set app.notification_push_secret = '<same value as NOTIFICATION_PUSH_SECRET>';

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function(s) to deploy (space-separated), or "all"'
        type: string
        default: 'notification-push'
      set_function_secrets:
        description: 'Push function secrets from repo secrets before deploying'
        type: boolean
        default: false
      push_migrations:
        description: 'Also run `supabase db push` (needs SUPABASE_DB_URL)'
        type: boolean
        default: false

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`) so a CLI release or setup-cli download hiccup
          # can't flake the deploy.
          version: 2.20.5

      - name: Preflight
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repo secrets are required."
            exit 1
          fi
          supabase --version

      - name: Set function secrets
        if: ${{ inputs.set_function_secrets }}
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            NOTIFICATION_PUSH_SECRET="${{ secrets.NOTIFICATION_PUSH_SECRET }}" \
            VAPID_PUBLIC_KEY="${{ secrets.VAPID_PUBLIC_KEY }}" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}" \
            APP_URL="${{ secrets.APP_URL }}"

      - name: Deploy functions
        run: |
          set -euo pipefail
          if [ "${{ inputs.functions }}" = "all" ]; then
            targets=$(find supabase/functions -maxdepth 1 -mindepth 1 -type d -exec basename {} \;)
          else
            targets="${{ inputs.functions }}"
          fi
          echo "Deploying: $targets"
          for fn in $targets; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Push migrations
        if: ${{ inputs.push_migrations }}
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::push_migrations requires the SUPABASE_DB_URL repo secret."
            exit 1
          fi
          supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
