name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Web + shared are what the pilot ships. The Expo app is validated once the
      # native workstream begins; skipping it here keeps CI off React Native's
      # heavier toolchain.
      - name: Typecheck & unit tests
        run: pnpm turbo run typecheck test --filter=@datumpro/web --filter=@datumpro/shared

      - name: Build web
        run: pnpm turbo run build --filter=@datumpro/web
        env:
          # Placeholders: the build compiles without contacting Supabase; real
          # values are injected at deploy time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://example.com

  # Applies every migration to a real local Supabase stack and runs the RLS /
  # tenancy regression suite (supabase/tests/rls_security.sql). Gating this means
  # a migration that weakens tenant isolation, the F2 MFA data-layer gate, the F5
  # WITH CHECK, or the F7 org cap fails the PR instead of reaching production.
  # Runs against the real stack (not a shim) so auth.users, auth.jwt() aal
  # claims, storage.buckets, and the anon/authenticated/service_role roles the
  # suite depends on match what production enforces.
  db-security:
    name: DB security (RLS regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots Postgres + Auth + Storage and applies all migrations in order; a
      # migration that errors fails the job here.
      - name: Start Supabase (applies migrations)
        run: supabase start

      # Clean re-apply from scratch — mirrors `pnpm db:reset`, and asserts the
      # migrations are replayable in order on an empty database.
      - name: Reset database (replay migrations)
        run: supabase db reset

      - name: RLS / tenancy regression suite
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls_security.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop
